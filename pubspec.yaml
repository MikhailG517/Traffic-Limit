name: traffic_limit
description: Русскоязычный мониторинг и ограничение сетевого трафика для Windows 11.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'
dependencies:
  flutter:
    sdk: flutter
  fl_chart: ^0.68.0
  ffi: ^2.1.2
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  tray_manager: ^0.2.3
  window_manager: ^0.3.9
  file_selector: ^1.0.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
flutter:
  uses-material-design: true
  assets:
    - assets/traffic_limit.png
