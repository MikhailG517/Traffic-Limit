name: traffic_limit
description: Русскоязычный мониторинг и ограничение сетевого трафика для Windows 11.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'
dependencies:
  flutter:
    sdk: flutter
  fl_chart: ^0.68.0
  ffi: ^2.1.2
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  tray_manager: ^0.5.3
  window_manager: ^0.3.9
  file_selector: ^1.0.3
  path_parsing: ^1.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
flutter:
  uses-material-design: true
  assets:
    - assets/traffic_limit.png
    - assets/traffic_limit.ico
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
