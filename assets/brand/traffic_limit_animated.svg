<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" fill="none">
  <defs>
    <linearGradient id="brand" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset=".55" stop-color="#5B8CFF"/>
      <stop offset="1" stop-color="#8B5CF6"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 32 32" to="360 32 32" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#0B101B"/>
  <path d="M16.44 49.56 A22 22 0 1 1 47.56 49.56" stroke="#1E2840" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M16.44 49.56 A22 22 0 1 1 47.56 49.56" stroke="url(#brand)" stroke-width="4.5" stroke-linecap="round"
        pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" values="100;0;0;100" keyTimes="0;.45;.8;1" dur="4s" repeatCount="indefinite"/>
  </path>
  <circle r="2.4" fill="#fff" filter="url(#glow)">
    <animateMotion dur="4s" repeatCount="indefinite" keyPoints="0;1;1;0" keyTimes="0;.45;.8;1" calcMode="linear"
                   path="M16.44 49.56 A22 22 0 1 1 47.56 49.56"/>
  </circle>
  <g stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M26 21 V42 M21 37 L26 42 L31 37" stroke="#22D3EE">
      <animateTransform attributeName="transform" type="translate" values="0 -2;0 2;0 -2" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <path d="M38 45 V24 M33 29 L38 24 L43 29" stroke="#FF5D8F">
      <animateTransform attributeName="transform" type="translate" values="0 2;0 -2;0 2" dur="1.6s" repeatCount="indefinite"/>
    </path>
  </g>
  <path d="M51.05 23 m-3 0 a3 3 0 1 0 6 0 a3 3 0 1 0 -6 0" fill="#FFB547">
    <animate attributeName="opacity" values="1;.35;1" dur="1.2s" repeatCount="indefinite"/>
  </path>
</svg>
