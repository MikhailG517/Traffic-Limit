name: Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze
          flutter test

      - name: Build Flutter application
        run: flutter build windows --release

      - name: Build Traffic Limit Service
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/native | Out-Null
          cmake -S windows/native/TrafficLimitService -B build/native/cmake
          cmake --build build/native/cmake --config Release
          Copy-Item build/native/cmake/Release/TrafficLimitService.exe build/native/TrafficLimitService.exe -Force
          Copy-Item build/native/cmake/Release/WinDivert.dll build/native/WinDivert.dll -Force
          Copy-Item build/native/cmake/Release/WinDivert64.sys build/native/WinDivert64.sys -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build one-file installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' installer\TrafficLimit.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrafficLimit-Setup
          path: dist/TrafficLimit-Setup-*.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TrafficLimit-Setup-*.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
